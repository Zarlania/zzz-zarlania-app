version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
          - 'jest-preset-angular'
          - 'zone.js'
          - 'rxjs'
        update-types:
          - patch
          - minor
      types:
        patterns:
          - '@types/*'
        update-types:
          - patch
          - minor
      typescript-eslint:
        patterns:
          - 'typescript-eslint'
          - '@typescript-eslint/*'
        update-types:
          - patch
          - minor
      typescript:
        patterns:
          - 'typescript'
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
