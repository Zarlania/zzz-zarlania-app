<header class="site-header">
  <a class="brand" routerLink="/">
    <app-logo />
    <span class="brand-name">Zarlania</span>
  </a>

  <div id="site-menu" class="site-menu" [class.open]="menuOpen()">
    <nav class="site-nav">
      <a routerLink="/" fragment="features" (click)="closeMenu()">Features</a>
      <a routerLink="/" fragment="how-it-works" (click)="closeMenu()">How it works</a>
    </nav>
    <div class="header-actions">
      <a class="link-login" routerLink="/login" (click)="closeMenu()">Log in</a>
      <a class="btn-signup" routerLink="/signup" (click)="closeMenu()">Sign up</a>
    </div>
  </div>

  <div class="bar-controls">
    <app-theme-toggle />
    <button
      type="button"
      class="menu-toggle"
      aria-label="Menu"
      aria-controls="site-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="footer-brand">
    <app-logo />
    <span>&copy; {{ year }} Zarlania</span>
  </div>
  <nav class="footer-links" aria-label="Footer">
    <div class="footer-group">
      <span class="footer-heading">Product</span>
      <a routerLink="/" fragment="features">Features</a>
      <a routerLink="/" fragment="how-it-works">How it works</a>
    </div>
    <div class="footer-group">
      <span class="footer-heading">Account</span>
      <a routerLink="/signup">Sign up</a>
      <a routerLink="/login">Log in</a>
    </div>
  </nav>
</footer>
